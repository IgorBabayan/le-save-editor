name: Release - Windows installer

# Runs every time a pull request is MERGED into the `release` branch.
# Builds a self-contained win-x64 publish, packs it with Inno Setup and
# publishes a GitHub Release (shown in the "Releases" panel of the repo page)
# with the installer attached. The newest run is marked as "Latest".
on:
  pull_request:
    types: [closed]
    branches: [release]
  workflow_dispatch: # manual re-run from the Actions tab

permissions:
  contents: write # needed to create tags and releases

concurrency:
  group: release-installer
  cancel-in-progress: false

env:
  PROJECT: LE.SaveEditor/LE.SaveEditor.csproj
  DB_PROJECT: LE.SaveEditor.DB/LE.SaveEditor.DB.csproj
  RUNTIME: win-x64
  CONFIGURATION: Release

jobs:
  build-installer:
    # Skip PRs that were closed without merging.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content $env:PROJECT
          $base = ($proj.Project.PropertyGroup | ForEach-Object { $_.VersionPrefix } | Where-Object { $_ } | Select-Object -First 1)
          if (-not $base) { $base = '0.1' }
          $parts = $base.Split('.')
          $version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version"    >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} -r ${{ env.RUNTIME }}

      - name: Publish (self-contained)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME }}
          --self-contained true
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=none
          -o publish

      # The editor starts the database generator from Tools\LE.SaveEditor.DB (title bar database button).
      - name: Publish database generator (self-contained)
        run: >
          dotnet publish ${{ env.DB_PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=none
          -o publish/Tools/LE.SaveEditor.DB

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\publish" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            installer\LE.SaveEditor.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LE.SaveEditor-Setup-${{ steps.version.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LE Save Editor ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          body: |
            Windows installer built from ${{ github.event.pull_request.html_url || github.sha }}
            ${{ github.event.pull_request.title }}
          generate_release_notes: true
          make_latest: true
          files: dist/*.exe
          fail_on_unmatched_files: true
