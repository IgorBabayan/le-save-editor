name: Release - Windows, Linux and macOS

# Runs every time a pull request is MERGED into the `release` branch.
# Builds self-contained publishes of the editor (with the database generator in Tools/LE.SaveEditor.DB) for
#   - Windows x64: Inno Setup installer (the in-app auto-updater downloads this one),
#   - Linux x64:   .tar.gz archive,
#   - macOS:       LE Save Editor.app in a .zip, for Apple silicon (arm64) and Intel (x64),
# then publishes one GitHub Release (shown in the "Releases" panel of the repo page) with every package attached.
# The newest run is marked as "Latest".
on:
  pull_request:
    types: [closed]
    branches: [release]
  workflow_dispatch: # manual re-run from the Actions tab

permissions:
  contents: write # needed to create tags and releases

concurrency:
  group: release-installer
  cancel-in-progress: false

env:
  PROJECT: LE.SaveEditor/LE.SaveEditor.csproj
  DB_PROJECT: LE.SaveEditor.DB/LE.SaveEditor.DB.csproj
  CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    # Skip PRs that were closed without merging.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Compute version
        id: version
        shell: bash
        run: |
          base=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' "$PROJECT" || true)
          [ -z "$base" ] && base="0.1"
          IFS='.' read -r major minor _ <<< "$base"
          version="${major}.${minor:-0}.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      RUNTIME: win-x64
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish editor (self-contained)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME }}
          --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:DebugType=none
          -o publish

      # The editor starts the database generator from Tools\LE.SaveEditor.DB (title bar database button).
      - name: Publish database generator (self-contained)
        run: >
          dotnet publish ${{ env.DB_PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME }}
          --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:DebugType=none
          -o publish/Tools/LE.SaveEditor.DB

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\publish" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            installer\LE.SaveEditor.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-win-x64
          path: dist/*.exe
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      RUNTIME: linux-x64
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish editor (self-contained)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME }}
          --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:DebugType=none
          -o publish/LE.SaveEditor

      - name: Publish database generator (self-contained)
        run: >
          dotnet publish ${{ env.DB_PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME }}
          --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:DebugType=none
          -o publish/LE.SaveEditor/Tools/LE.SaveEditor.DB

      - name: Pack .tar.gz
        run: |
          chmod +x publish/LE.SaveEditor/LE.SaveEditor publish/LE.SaveEditor/Tools/LE.SaveEditor.DB/LE.SaveEditor.DB
          mkdir -p dist
          tar -C publish -czf "dist/LE.SaveEditor-${VERSION}-linux-x64.tar.gz" LE.SaveEditor
          ls -l dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    strategy:
      matrix:
        runtime: [osx-arm64, osx-x64]
    env:
      RUNTIME: ${{ matrix.runtime }}
      VERSION: ${{ needs.version.outputs.version }}
      APP: LE Save Editor.app
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish editor (self-contained)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME }}
          --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:DebugType=none
          -o "publish/${{ env.APP }}/Contents/MacOS"

      # In Contents/Resources: codesign rejects sub-folders of Contents/MacOS ("bundle format unrecognized").
      # The editor looks for the tool there on macOS (Services/GameData/DatabaseGenerator.cs).
      - name: Publish database generator (self-contained)
        run: >
          dotnet publish ${{ env.DB_PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME }}
          --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:DebugType=none
          -o "publish/${{ env.APP }}/Contents/Resources/Tools/LE.SaveEditor.DB"

      - name: Build app bundle
        run: |
          contents="publish/${APP}/Contents"
          mkdir -p "$contents/Resources"
          # App icon from the Windows .ico (best effort: the bundle works without it).
          if sips -s format icns LE.SaveEditor/App.ico --out "$contents/Resources/App.icns" >/dev/null 2>&1; then
            icon_entry="<key>CFBundleIconFile</key><string>App.icns</string>"
          fi
          cat > "$contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>LE Save Editor</string>
            <key>CFBundleDisplayName</key><string>LE Save Editor</string>
            <key>CFBundleIdentifier</key><string>com.igorbabayan.le-save-editor</string>
            <key>CFBundleExecutable</key><string>LE.SaveEditor</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            ${icon_entry:-}
          </dict>
          </plist>
          EOF
          chmod +x "$contents/MacOS/LE.SaveEditor" "$contents/Resources/Tools/LE.SaveEditor.DB/LE.SaveEditor.DB"
          # Ad-hoc signature (required to run on Apple silicon; the app is not notarized, so the first start is
          # right-click → Open). Every Mach-O file is signed on its own first, then the bundle (no --deep: it would
          # take the tool's folder for a nested bundle).
          find "$contents" -type f -print0 | while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q 'Mach-O'; then
              codesign --force --sign - "$file"
            fi
          done
          codesign --force --sign - "publish/${APP}"
          codesign --verify --verbose "publish/${APP}"
          mkdir -p dist
          ditto -c -k --keepParent "publish/${APP}" "dist/LE.SaveEditor-${VERSION}-${RUNTIME}.zip"
          ls -l dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.runtime }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: LE Save Editor ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          body: |
            Built from ${{ github.event.pull_request.html_url || github.sha }}
            ${{ github.event.pull_request.title }}

            - **Windows**: `LE.SaveEditor-Setup-*.exe` (installer; installed copies update themselves).
            - **Linux x64**: `*-linux-x64.tar.gz` — extract and run `LE.SaveEditor/LE.SaveEditor`.
            - **macOS**: `*-osx-arm64.zip` (Apple silicon) or `*-osx-x64.zip` (Intel) — unzip, then right-click
              *LE Save Editor.app* → Open the first time (the app is not notarized).
          generate_release_notes: true
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
